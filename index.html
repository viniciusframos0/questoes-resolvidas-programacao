<style>
  :root{
    --bg:#f6f5f2; --surface:#ffffff; --surface-2:#f0efeb; --border:#e3e1da;
    --text:#1b1b1f; --muted:#6b6a72; --accent:#5b4cf0; --accent-soft:#ecebfe; --on-accent:#ffffff;
    --shadow:0 1px 2px rgba(20,20,30,.04),0 8px 24px rgba(20,20,30,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f0f13; --surface:#18181e; --surface-2:#202028; --border:#2b2b35;
      --text:#f1f0f5; --muted:#9a99a6; --accent:#8b80ff; --accent-soft:#25233d; --on-accent:#0f0f13;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f0f13; --surface:#18181e; --surface-2:#202028; --border:#2b2b35;
    --text:#f1f0f5; --muted:#9a99a6; --accent:#8b80ff; --accent-soft:#25233d; --on-accent:#0f0f13;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:36px 16px 72px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:999px}
  h1{font-size:clamp(30px,6vw,48px);line-height:1.08;letter-spacing:-.025em;margin:14px 0 10px;font-weight:800}
  h1 span{color:var(--accent)}
  .lead{color:var(--muted);margin:0;max-width:580px;font-size:16px}
  .theme-btn{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center;transition:.2s}
  .theme-btn:hover{border-color:var(--accent)}

  .tools{display:grid;gap:12px;margin-bottom:18px}
  .search{position:relative}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  #busca{width:100%;height:52px;border-radius:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:500 16px Inter,sans-serif;padding:0 16px 0 46px;outline:none;transition:.15s;box-shadow:var(--shadow)}
  #busca:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 12px;border-radius:999px;font:500 13px Inter,sans-serif;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .count{font-size:13px;color:var(--muted);margin:0 0 10px}

  .list{display:grid;gap:10px;list-style:none;margin:0;padding:0}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s}
  .item.open{border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
  .head{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer}
  .head:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:16px}
  .num{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 15px "JetBrains Mono",monospace}
  .ttl{flex:1;min-width:0}
  .ttl strong{display:block;font-size:16px;font-weight:700;line-height:1.3}
  .ttl small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  .chev{flex:none;color:var(--muted);transition:transform .25s}
  .item.open .chev{transform:rotate(180deg);color:var(--accent)}
  .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
  .item.open .body{grid-template-rows:1fr}
  .body > div{overflow:hidden}
  .inner{padding:0 18px 18px 76px}
  .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
  .enun{margin:0 0 14px;font-size:15px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
  .tag{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--border);padding:3px 9px;border-radius:999px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer;transition:.15s;border:1px solid transparent}
  .btn.primary{background:var(--accent);color:var(--on-accent)}
  .btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--text)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;border:1px dashed var(--border);border-radius:16px}
  footer{margin-top:36px;text-align:center;font-size:13px;color:var(--muted)}

  @media (max-width:560px){
    .inner{padding:0 16px 16px}
    .head{padding:14px 16px;gap:12px}
    .num{width:40px;height:40px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <span class="badge">● Lógica de programação</span>
      <h1>Questões <span>resolvidas</span></h1>
      <p class="lead">Cada exercício virou um programa de verdade. Clique numa questão para ler o enunciado e abra a solução para testar e estudar o algoritmo passo a passo.</p>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Alternar tema claro/escuro" title="Alternar tema">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <div class="tools">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="busca" type="search" placeholder="Buscar por título, enunciado ou número…" aria-label="Buscar questões" autocomplete="off">
    </div>
    <div class="filters" id="filtros" aria-label="Filtrar por tema"></div>
  </div>

  <p class="count" id="contagem" aria-live="polite"></p>
  <ul class="list" id="lista"></ul>

  <footer>Material de apoio para as aulas de lógica de programação.</footer>
</div>

<script src="questoes.js"></script>
<script>
  const Q = window.QUESTOES || [];
  const $ = (s) => document.querySelector(s);
  const lista = $('#lista'), busca = $('#busca'), filtros = $('#filtros'), contagem = $('#contagem');
  let temaAtivo = 'Todos';

  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  // Filtros por tema (aparecem só se houver mais de um tema)
  const temas = ['Todos', ...new Set(Q.map(q => q.tema).filter(Boolean))];
  if (temas.length > 2) {
    filtros.innerHTML = temas.map(t => `<button class="chip" aria-pressed="${t === 'Todos'}" data-tema="${esc(t)}">${esc(t)}</button>`).join('');
    filtros.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      temaAtivo = b.dataset.tema;
      filtros.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
      render();
    });
  }

  const chev = `<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
  const seta = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

  function render() {
    const termo = norm(busca.value.trim());
    const itens = Q.filter(q =>
      (temaAtivo === 'Todos' || q.tema === temaAtivo) &&
      (!termo || norm(`${q.numero} ${q.titulo} ${q.enunciado} ${q.tema} ${(q.conceitos||[]).join(' ')}`).includes(termo)));

    contagem.textContent = itens.length === 1 ? '1 questão' : `${itens.length} questões`;
    if (!itens.length) {
      lista.innerHTML = `<li class="empty">Nenhuma questão encontrada para essa busca.</li>`;
      return;
    }
    const aberta = location.hash.slice(1);
    lista.innerHTML = itens.map(q => `
      <li class="item${aberta === q.numero ? ' open' : ''}" id="q${esc(q.numero)}">
        <button class="head" aria-expanded="${aberta === q.numero}" aria-controls="b${esc(q.numero)}" data-num="${esc(q.numero)}">
          <span class="num">${esc(q.numero)}</span>
          <span class="ttl"><strong>${esc(q.titulo)}</strong><small>${esc(q.tema || '')}</small></span>
          ${chev}
        </button>
        <div class="body" id="b${esc(q.numero)}" role="region" aria-label="Enunciado da questão ${esc(q.numero)}">
          <div><div class="inner">
            <p class="lbl">Enunciado</p>
            <p class="enun">${esc(q.enunciado)}</p>
            ${(q.conceitos||[]).length ? `<div class="tags">${q.conceitos.map(c => `<span class="tag">${esc(c)}</span>`).join('')}</div>` : ''}
            <div class="actions">
              <a class="btn primary" href="${esc(q.pasta)}">Abrir solução ${seta}</a>
              <button class="btn ghost" data-link="${esc(q.numero)}">Copiar link</button>
            </div>
          </div></div>
        </div>
      </li>`).join('');
  }

  lista.addEventListener('click', async e => {
    const head = e.target.closest('.head');
    if (head) {
      const li = head.parentElement, abrir = !li.classList.contains('open');
      li.classList.toggle('open', abrir);
      head.setAttribute('aria-expanded', abrir);
      history.replaceState(null, '', abrir ? '#' + head.dataset.num : location.pathname);
      return;
    }
    const cp = e.target.closest('[data-link]');
    if (cp) {
      const q = Q.find(x => x.numero === cp.dataset.link);
      const url = new URL(q.pasta, location.href).href;
      try { await navigator.clipboard.writeText(url); cp.textContent = 'Link copiado ✓'; }
      catch { cp.textContent = 'Não foi possível copiar'; }
      setTimeout(() => cp.textContent = 'Copiar link', 1600);
    }
  });

  busca.addEventListener('input', render);

  $('#themeBtn').addEventListener('click', () => {
    const root = document.documentElement;
    const escuro = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = escuro ? 'light' : 'dark';
    try { localStorage.setItem('tema', root.dataset.theme); } catch {}
  });
  try { const t = localStorage.getItem('tema'); if (t) document.documentElement.dataset.theme = t; } catch {}

  render();
  if (location.hash) document.getElementById('q' + location.hash.slice(1))?.scrollIntoView({ block: 'center' });
</script>
</body>
</html>
